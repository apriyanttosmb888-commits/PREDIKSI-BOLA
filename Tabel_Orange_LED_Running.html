
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabel Orange LED Running</title>
<style>
body{
background:#111;
padding:30px;
font-family:Segoe UI,sans-serif;
}

.custom-table-watitoto3 table{
width:90%;
margin:auto;
border-collapse:collapse;
background:#121212;
color:#fff;
border-radius:18px;
overflow:hidden;
position:relative;
border:2px solid rgba(255,140,0,.6);
box-shadow:0 0 20px rgba(255,140,0,.3);
}

.custom-table-watitoto3 table::after{
content:'';
position:absolute;
inset:-2px;
border-radius:18px;
padding:2px;
background:linear-gradient(
90deg,
transparent 0%,
transparent 20%,
#ff6b00 35%,
#ffd27a 50%,
#ff6b00 65%,
transparent 80%,
transparent 100%);
background-size:300% 300%;
animation:borderRun 4s linear infinite;
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;
pointer-events:none;
}

.custom-table-watitoto3 table::before{
content:'';
position:absolute;
top:0;
left:-50%;
width:30%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
animation:sweepLight 5s linear infinite;
pointer-events:none;
}

@keyframes borderRun{
0%{background-position:0% 50%;}
100%{background-position:300% 50%;}
}

@keyframes sweepLight{
100%{left:150%;}
}

th[colspan]{
background:#ff8c00;
color:#000;
padding:15px;
font-size:20px;
}

th,td{
padding:12px;
text-align:center;
border:1px dashed rgba(255,140,0,.4);
}

tr:nth-child(even){
background:rgba(255,140,0,.05);
}
</style>
</head>
<body>
<div class="custom-table-watitoto3">
<table>
<tr><th colspan="3">NORWAY ELITESERIEN</th></tr>
<tr>
<th>Tanggal & Waktu</th>
<th>Pertandingan</th>
<th>Skor</th>
</tr>
<tr><td>30/05 00:00 WIB</td><td>Rosenborg vs Bodo Glimt</td><td>1 : 0</td></tr>
<tr><td>30/05 00:00 WIB</td><td>Valerenga vs Kristiansund</td><td>0 : 1</td></tr>
<tr><td>30/05 00:00 WIB</td><td>KFUM Oslo vs Tromso</td><td>4 : 0</td></tr>
</table>
</div>
</body>
</html>
